<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>QC Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin: 0; }
  @media print {
    @page { size: A4 portrait; margin: 10mm; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: white !important; }
    .print-expand { overflow: visible !important; height: auto !important; min-height: 0 !important; }
    th, td { padding-top: 4px !important; padding-bottom: 4px !important; }
    .recharts-responsive-container { height: 280px !important; }
    .print\:hidden { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/template" id="qc-app-source">
const { useState, useEffect, useMemo, useCallback } = React;
const {
  LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip,
  ReferenceLine, ResponsiveContainer, Legend
} = Recharts;

function iconWrap(paths) {
  return function Icon({ size = 16, className = "" }) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {paths}
      </svg>
    );
  };
}
const Plus = iconWrap(<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>);
const Trash2 = iconWrap(<><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>);
const Settings = iconWrap(<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>);
const LayoutDashboard = iconWrap(<><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></>);
const FileDown = iconWrap(<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></>);
const Beaker = iconWrap(<><path d="M4.5 3h15"/><path d="M6 3v7l-4 8a1 1 0 0 0 1 1.5h18a1 1 0 0 0 1-1.5l-4-8V3"/><path d="M6 14h12"/></>);
const Activity = iconWrap(<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>);
const X = iconWrap(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>);
const Printer = iconWrap(<><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></>);

const STORAGE_KEY = "qc-manager-data-v5";
const LEVEL_COLORS = { Low: "#0284c7", Normal: "#16a34a", High: "#dc2626" };
function loadData() { try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {} return { analyzers: [], backup: { path: "", driveLink: "" } }; }
function saveData(data) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; } catch (e) { return false; } }
const uid = () => Math.random().toString(36).slice(2, 10);
function evaluateWestgard(points, mean, sd) {
  const z = points.map(p => (sd ? (p.value - mean) / sd : 0));
  const flags = points.map(() => ({ violations: [], severity: null }));
  const flag = (i, code, severity) => { flags[i].violations.push(code); if (severity === "reject") flags[i].severity = "reject"; else if (flags[i].severity !== "reject") flags[i].severity = "warning"; };
  for (let i = 0; i < z.length; i++) {
    if (Math.abs(z[i]) > 2) flag(i, "1-2s", "warning");
    if (Math.abs(z[i]) > 3) flag(i, "1-3s", "reject");
    if (i >= 1 && Math.abs(z[i]) > 2 && Math.abs(z[i - 1]) > 2 && Math.sign(z[i]) === Math.sign(z[i - 1])) flag(i, "2-2s", "reject");
    if (i >= 1 && Math.abs(z[i] - z[i - 1]) > 4) flag(i, "R-4s", "reject");
    if (i >= 3) {
      const w4 = z.slice(i - 3, i + 1);
      if (w4.every(v => Math.abs(v) > 1) && w4.every(v => Math.sign(v) === Math.sign(w4[0]))) flag(i, "4-1s", "reject");
    }
    if (i >= 9) {
      const w10 = z.slice(i - 9, i + 1);
      if (w10.every(v => v > 0) || w10.every(v => v < 0)) flag(i, "10x", "reject");
    }
  }
  return flags;
}
function Btn({ children, onClick, variant = "primary", className = "", type = "button", disabled }) {
  const base = "inline-flex items-center gap-1.5 px-3 py-2 rounded-md text-sm font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed";
  const variants = { primary: "bg-teal-700 text-white hover:bg-teal-800", secondary: "bg-white text-slate-700 border border-slate-300 hover:bg-slate-50", danger: "bg-white text-red-600 border border-red-200 hover:bg-red-50" };
  return <button type={type} disabled={disabled} onClick={onClick} className={`${base} ${variants[variant]} ${className}`}>{children}</button>;
}
function Field({ label, children }) { return <label className="flex flex-col gap-1 text-sm"><span className="text-slate-500 font-medium">{label}</span>{children}</label>; }
const inputCls = "border border-slate-300 rounded-md px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600";
function Modal({ title, onClose, children }) { return <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 p-4 print:hidden" onClick={onClose}><div className="bg-white rounded-lg shadow-xl w-full max-w-md" onClick={e => e.stopPropagation()}><div className="flex items-center justify-between px-5 py-4 border-b border-slate-200"><h3 className="font-semibold text-slate-800">{title}</h3><button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X size={18} /></button></div><div className="p-5">{children}</div></div></div>; }
function QCManager() {
  const [data, setData] = useState(null); const [loading, setLoading] = useState(true); const [view, setView] = useState("dashboard"); const [selectedAnalyzerId, setSelectedAnalyzerId] = useState(null); const [selectedTestId, setSelectedTestId] = useState(null); const [modal, setModal] = useState(null);
  useEffect(() => { const d = loadData(); setData(d); if (d.analyzers.length) { setSelectedAnalyzerId(d.analyzers[0].id); setSelectedTestId(d.analyzers[0].tests[0]?.id ?? null); } setLoading(false); }, []);
  const persist = useCallback((next) => { setData(next); saveData(next); }, []);
  if (loading) return <div className="min-h-screen flex items-center justify-center bg-slate-50 text-slate-500 text-sm">Loading QC application…</div>;
  const analyzer = data.analyzers.find(a => a.id === selectedAnalyzerId) || null; const test = analyzer?.tests.find(t => t.id === selectedTestId) || null;
  const addAnalyzer = (name) => { const a = { id: uid(), name, tests: [] }; const next = { ...data, analyzers: [...data.analyzers, a] }; persist(next); setSelectedAnalyzerId(a.id); setSelectedTestId(null); };
  const deleteAnalyzer = (id) => { const next = { ...data, analyzers: data.analyzers.filter(a => a.id !== id) }; persist(next); if (selectedAnalyzerId === id) { setSelectedAnalyzerId(next.analyzers[0]?.id ?? null); setSelectedTestId(next.analyzers[0]?.tests[0]?.id ?? null); } };
  const addTest = (analyzerId, name) => { const t = { id: uid(), name, levels: [] }; const next = { ...data, analyzers: data.analyzers.map(a => a.id === analyzerId ? { ...a, tests: [...a.tests, t] } : a) }; persist(next); setSelectedTestId(t.id); };
  const deleteTest = (analyzerId, testId) => { const next = { ...data, analyzers: data.analyzers.map(a => a.id === analyzerId ? { ...a, tests: a.tests.filter(t => t.id !== testId) } : a) }; persist(next); if (selectedTestId === testId) setSelectedTestId(null); };
  const addLevel = (analyzerId, testId, levelData) => { const lvl = { id: uid(), lotNumber: levelData.lotNumber, levelType: levelData.levelType, mean: levelData.mean, sd: levelData.sd, entries: [] }; const next = { ...data, analyzers: data.analyzers.map(a => a.id !== analyzerId ? a : { ...a, tests: a.tests.map(t => t.id !== testId ? t : { ...t, levels: [...t.levels, lvl] }) }) }; persist(next); };
  const deleteLevel = (analyzerId, testId, levelId) => { const next = { ...data, analyzers: data.analyzers.map(a => a.id !== analyzerId ? a : { ...a, tests: a.tests.map(t => t.id !== testId ? t : { ...t, levels: t.levels.filter(l => l.id !== levelId) }) }) }; persist(next); };
  const addEntry = (analyzerId, testId, levelType, entry) => { const next = { ...data, analyzers: data.analyzers.map(a => a.id !== analyzerId ? a : { ...a, tests: a.tests.map(t => t.id !== testId ? t : { ...t, levels: t.levels.map(l => l.levelType !== levelType ? l : { ...l, entries: [...l.entries, { id: uid(), date: entry.date, value: entry.value, timestamp: Date.now() }] }) }) }) }; persist(next); };
  const deleteEntry = (analyzerId, testId, levelId, entryId) => { const next = { ...data, analyzers: data.analyzers.map(a => a.id !== analyzerId ? a : { ...a, tests: a.tests.map(t => t.id !== testId ? t : { ...t, levels: t.levels.map(l => l.id !== levelId ? l : { ...l, entries: l.entries.filter(e => e.id !== entryId) } ) }) }) }; persist(next); };
  const backupInfo = { path: data.backup?.path ?? "", driveLink: data.backup?.driveLink ?? "" };
  const updateBackup = (backup) => { const next = { ...data, backup: { ...backupInfo, ...backup } }; persist(next); };
  return <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col print-expand"><TopBar view={view} setView={setView} data={data} /><div className="flex flex-1 overflow-hidden print-expand print:block"><Sidebar data={data} selectedAnalyzerId={selectedAnalyzerId} selectedTestId={selectedTestId} onSelectAnalyzer={(id) => { setSelectedAnalyzerId(id); const a = data.analyzers.find(x => x.id === id); setSelectedTestId(a?.tests[0]?.id ?? null); setView("dashboard"); }} onSelectTest={(id) => { setSelectedTestId(id); setView("dashboard"); }} onAddAnalyzer={() => setModal({ type: "addAnalyzer" })} onAddTest={() => setModal({ type: "addTest", analyzerId: analyzer?.id })} onDeleteAnalyzer={deleteAnalyzer} onDeleteTest={deleteTest} /><main className="flex-1 overflow-y-auto p-6 print:p-0 print-expand">{view === "dashboard" && <Dashboard analyzer={analyzer} test={test} onAddEntry={(lvlType, entry) => addEntry(analyzer.id, test.id, lvlType, entry)} onDeleteEntry={(lvlId, entryId) => deleteEntry(analyzer.id, test.id, lvlId, entryId)} onRequestAddTest={() => setModal({ type: "addTest", analyzerId: analyzer?.id })} onRequestAddLevel={() => setModal({ type: "addLevel", analyzerId: analyzer?.id, testId: test?.id })} onRequestAddAnalyzer={() => setModal({ type: "addAnalyzer" })} />}{view === "reports" && <Reports data={data} />}{view === "settings" && <SettingsView data={data} onUpdateBackup={updateBackup} onAddAnalyzer={() => setModal({ type: "addAnalyzer" })} onDeleteAnalyzer={deleteAnalyzer} onAddTest={(analyzerId) => setModal({ type: "addTest", analyzerId })} onDeleteTest={deleteTest} onAddLevel={(analyzerId, testId) => setModal({ type: "addLevel", analyzerId, testId })} onDeleteLevel={deleteLevel} />}</main></div>{modal?.type === "addAnalyzer" && <Modal title="Add Analyzer" onClose={() => setModal(null)}><SimpleForm fields={[{ key: "name", label: "Analyzer Name", placeholder: "e.g. Cobas c311 / Mindray BS-240" }]} onSubmit={(v) => { addAnalyzer(v.name); setModal(null); }} onCancel={() => setModal(null)} /></Modal>}{modal?.type === "addTest" && <Modal title="Add Test Parameter" onClose={() => setModal(null)}><SimpleForm fields={[{ key: "name", label: "Test Name", placeholder: "e.g. Glucose, Cholesterol" }]} onSubmit={(v) => { addTest(modal.analyzerId, v.name); setModal(null); }} onCancel={() => setModal(null)} /></Modal>}{modal?.type === "addLevel" && <Modal title="Add Level Setup" onClose={() => setModal(null)}><SimpleForm fields={[{ key: "lotNumber", label: "QC Lot Number", placeholder: "e.g. LOT99201" },{ key: "levelType", label: "QC Level", type: "select", options: ["Low", "Normal", "High"] },{ key: "mean", label: "Target Mean (x̄)", placeholder: "e.g. 100", type: "number" },{ key: "sd", label: "Target SD", placeholder: "e.g. 2.5", type: "number" }]} onSubmit={(v) => { addLevel(modal.analyzerId, modal.testId, { lotNumber: v.lotNumber, levelType: v.levelType, mean: parseFloat(v.mean), sd: parseFloat(v.sd) }); setModal(null); }} onCancel={() => setModal(null)} /></Modal>}</div>; }
function SettingsView({ data, onUpdateBackup, onAddAnalyzer, onDeleteAnalyzer, onAddTest, onDeleteTest, onAddLevel, onDeleteLevel }) { const backupPath = data.backup?.path ?? ""; const driveLink = data.backup?.driveLink ?? ""; return <div className="space-y-6"><div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"><div className="flex items-center justify-between gap-3 mb-4"><div><h2 className="text-lg font-semibold text-slate-900">Backup & Dashboard Sharing</h2><p className="text-sm text-slate-500">Save a backup path and a shared drive link for read-only QC dashboard viewing.</p></div></div><div className="grid gap-4 sm:grid-cols-2"><Field label="Backup folder / drive path"><input type="text" value={backupPath} onChange={(e) => onUpdateBackup({ path: e.target.value })} className={inputCls} placeholder="e.g. D:\\QC Backups or /mnt/backup/qc" /></Field><Field label="Shared dashboard drive link"><input type="url" value={driveLink} onChange={(e) => onUpdateBackup({ driveLink: e.target.value })} className={inputCls} placeholder="e.g. https://drive.google.com/..." /></Field></div><div className="mt-4 rounded-lg bg-slate-50 p-4 text-sm text-slate-600"><p className="mb-2">This drive link can be shared with third-party viewers to allow dashboard access only. They will be able to select analyzer and test filters, but not add or edit QC data.</p>{driveLink ? <a href={driveLink} target="_blank" rel="noreferrer" className="inline-flex items-center gap-2 rounded-md bg-teal-700 px-3 py-2 text-sm font-medium text-white hover:bg-teal-800">Open view-only dashboard</a> : <span className="text-slate-400">Enter a shared drive link to enable view-only dashboard access.</span>}</div></div></div>; }
function TopBar({ view, setView, data }) { const tabs = [{ key: "dashboard", label: "Dashboard View", icon: LayoutDashboard }, { key: "reports", label: "QC Summary", icon: FileDown }, { key: "settings", label: "Configuration", icon: Settings }]; return <header className="bg-teal-900 text-white px-6 py-3 flex items-center justify-between shrink-0 print:hidden"><div className="flex items-center gap-2.5"><div className="w-8 h-8 rounded-md bg-teal-600 flex items-center justify-center"><Activity size={18} /></div><div><div className="font-semibold leading-tight">Unified QC Manager</div><div className="text-[11px] text-teal-200">Date-Wise Levey-Jennings Analysis</div></div></div><nav className="flex gap-1 bg-teal-800/60 rounded-lg p-1">{tabs.map(t => { const Icon = t.icon; return <button key={t.key} onClick={() => setView(t.key)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${view === t.key ? "bg-white text-teal-900" : "text-teal-100 hover:bg-teal-700/60"}`}><Icon size={15} /> {t.label}</button>; })}</nav></header>; }
</script>
<script>
  (() => {
    const source = document.getElementById('qc-app-source').textContent;
    const transformed = Babel.transform(source, {
      presets: ['env'],
      plugins: [['transform-react-jsx', { runtime: 'classic' }]]
    }).code;
    eval(transformed);
  })();
</script>
</body>
</html>
